{% extends "base.html" %}
{% load static %}

{% block body %}
    <div id="main">
        <h1>História prevozu</h1>

        <h2>Filtre</h2>
        <div id="filters">
            <div class="filter-group">
                <div class="date-input-container">
                    <label for="start-date">
                        <i class="fa fa-calendar"></i> Od:
                    </label>
                    <input type="text" id="start-date" class="date-picker" placeholder="Vyber dátum">
                    <button class="delete-btn" onclick="clearDate('start-date')">
                        <i class="fa fa-times"></i>
                    </button>
                </div>
                <div class="date-input-container">
                    <label for="end-date">
                        <i class="fa fa-calendar"></i> Do:
                    </label>
                    <input type="text" id="end-date" class="date-picker" placeholder="Vyber dátum">
                    <button class="delete-btn" onclick="clearDate('end-date')">
                        <i class="fa fa-times"></i>
                    </button>
                </div>
            </div>

            <div class="filter-group">
                <label for="filterEvent"><i class="fas fa-list"></i> Event:</label>
                <input type="text" id="filterEvent" list="events" name="event" placeholder="Filtrovať podľa eventu">
            </div>

            <div class="filter-group">
                <label for="filterSource"><i class="fas fa-sign-in-alt"></i> Zdroj:</label>
                <input type="text" id="filterSource" placeholder="Filtrovať podľa zdroja">
            </div>

            <div class="filter-group">
                <label for="filterDestination"><i class="fas fa-sign-out-alt"></i> Cieľ:</label>
                <input type="text" id="filterDestination" placeholder="Filtrovať podľa cieľa">
            </div>

            <div class="filter-group">
                <label for="filterFrequency"><i class="fas fa-wave-square"></i> Frekvencia:</label>
                <input type="text" id="filterFrequency" placeholder="Filtrovať podľa frekvencie">
            </div>
            
            

            <div class="filter-group">
                <button type="button" id="toggleAdvancedFilters" class="btn btn-custom">
                    <i class="fas fa-filter"></i> Rozšírené filtrovanie
                    <i class="fas fa-chevron-down toggle-icon"></i>
                </button>
            </div>
        </div>
        
        <div id="advancedFiltersContainer" style="display: none;">
            <div class="advanced-filters">
                <h3><i class="fas fa-sliders-h"></i> Pokročilé filtre</h3>
                
                <div class="filter-row">
                    <div class="filter-group">
                        <label for="filterDetails"><i class="fas fa-search-plus"></i> Detail obsahuje:</label>
                        <input type="text" id="filterDetails" placeholder="Filtrovať podľa obsahu detailov">
                    </div>


                    <div class="filter-group">
                        <label for="minDuration"><i class="fas fa-clock"></i> Dĺžka:</label>
                        <div class="duration-inputs">
                            <input type="number" id="minDuration" placeholder="Min (s)" min="0" step="0.1" class="duration-input">
                            <span>-</span>
                            <input type="number" id="maxDuration" placeholder="Max (s)" min="0" step="0.1" class="duration-input">
                        </div>
                    </div>
                    
                    <div class="filter-group">
                        <label for="filterTimeslot"><i class="fas fa-layer-group"></i> Timeslot:</label>
                        <select id="filterTimeslot">
                            <option value="">Všetky</option>
                            <option value="1">Timeslot 1</option>
                            <option value="2">Timeslot 2</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label for="filterColorCode"><i class="fas fa-palette"></i> Color code:</label>
                        <select id="filterColorCode">
                            <option value="">Všetky</option>
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                            <option value="13">13</option>
                            <option value="14">14</option>
                            <option value="15">15</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <table id="myTable" class="display stripe hover cell-border" style="width:100%">
            <thead>
            <tr>
                <th>Časový záznam</th>
                <th>Dĺžka (s)</th>
                <th>Event</th>
                <th>Zdroj</th>
                <th>Cieľ</th>
                <th>Frekvencia</th>
                <th>Ďalšie možnosti</th>
            </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
    </div>

    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdn.datatables.net/plug-ins/1.13.6/sorting/datetime-moment.js"></script>

    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/sk.js"></script>


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        let table;

        function deleteDmrData(eventId, table) {
            fetch(`/api/dmr-delete/${eventId}/`, {
                method: 'DELETE'
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Chyba: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    Swal.fire({
                        title: 'Úspešne zmazané',
                        text: data.message,
                        icon: 'success',
                        confirmButtonText: 'Zatvoriť'
                    });
                    table.draw();
                })
                .catch(error => {
                    Swal.fire({
                        title: 'Chyba!',
                        text: error,
                        icon: 'error',
                        confirmButtonText: 'Zatvoriť'
                    });

                });
        }

        $(document).ready(function () {

            flatpickr(".date-picker", {
                dateFormat: "d.m.Y",
                locale: "sk",
                allowInput: true,
                maxDate: "today",
                static: true,
                position: "start"
            });


            $.fn.dataTable.moment('DD.MM.YYYY HH:mm:ss');

            table = $('#myTable').DataTable({
                processing: true,
                serverSide: true,
                ajax: {
                    url: "/api/dmr-history/",
                    type: "GET",
                    data: function (d) {
                        d.filterEvent = $('#filterEvent').val();
                        d.filterSource = $('#filterSource').val();
                        d.filterDestination = $('#filterDestination').val();
                        d.filterFrequency = $('#filterFrequency').val();
                        d.filterDetails = $('#filterDetails').val();
                        d.start_date = $('#start-date').val();
                        d.end_date = $('#end-date').val();
                        d.minDuration = $('#minDuration').val();
                        d.maxDuration = $('#maxDuration').val();
                        d.filterTimeslot = $('#filterTimeslot').val();
                        d.filterColorCode = $('#filterColorCode').val();
                    }
                },
                columns: [
                    {"data": "timestamp"},
                    {"data": "duration_s"},
                    {"data": "event"},
                    {"data": "source"},
                    {"data": "destination"},
                    {"data": "frequency"},
                    {
                        "data": "event_id",
                        "orderable": false,
                        "render": function (data) {
                            return `<button class="detail-btn" data-id="${data}">Detaily</button>
                                    <button class="delete-btn" data-id="${data}">Zmazať</button>`;
                        }
                    }
                ],
                order: [[0, "desc"]],
                language: {
                    url: "https://cdn.datatables.net/plug-ins/1.13.6/i18n/sk.json"
                }
            });

            $('#filterEvent, #filterSource, #filterDestination, #filterFrequency, #start-date, #end-date, #minDuration, #maxDuration, #filterTimeslot, #filterColorCode').on('keyup change', function () {
                table.draw();
            });

            $('#myTable tbody').on('click', '.detail-btn', async function () {
                let eventId = $(this).data('id');

                try {
                    let response = await fetch(`/api/dmr-detail/${eventId}/`);
                    if (!response.ok) {
                        throw new Error(`Chyba: ${response.status}`);
                    }
                    let data = await response.json();
                    let details = data.details ? (data.details !== "SERVICE OPTIONS []" ? data.details : "") : "Žiadne";
                    let decodedData = "";

                    if (data.event.includes("SMS")) {
                        if (!details.includes("Error")) {
                            let byteArray = new Uint8Array(details.split('').map(char => char.charCodeAt(0)));
                            let hexString = Array.from(byteArray).map(byte => byte.toString(16).padStart(2, '0')).join('');
                            details = hexString.toUpperCase();
                        } else {
                            details = "";
                        }
                    }
                    
                    const isShortData = details.includes("DEFINED SHORT DATA PACKET");
                    const isUnknownData = details.includes("UNKNOWN PACKET");
                    
                    let recommendedSettings = {
                        startPos: 9,
                        endPos: -4,
                        decodeType: 'ascii'
                    };
                    
                    if (isUnknownData) {
                        const hexMatch = details.match(/UNKNOWN PACKET:(.*)/);
                        if (hexMatch && hexMatch[1]) {
                            const hexPart = hexMatch[1].trim();
                            
                            if (hexPart.length > 15) {
                                if (/[0-9A-F]{8}$/.test(hexPart)) {
                                    recommendedSettings.endPos = hexPart.length - 8;
                                }
                            }
                            
                            const possibleAscii = /[0-9A-F]{2}[20-7E][0-9A-F]{2}[20-7E]/.test(hexPart.substring(recommendedSettings.startPos));
                            if (possibleAscii) {
                                recommendedSettings.decodeType = 'ascii';
                            } else {
                                const possibleUtf16 = /00[0-9A-F]{2}00[0-9A-F]{2}/.test(hexPart.substring(recommendedSettings.startPos));
                                if (possibleUtf16) {
                                    recommendedSettings.decodeType = 'utf-16';
                                }
                            }
                        }
                    }

                    if (isShortData || isUnknownData) {
                        const sweetAlertContent = `
                            <div class="decode-container">
                                <div class="packet-info">
                                    <h4 class="section-title">Informácie o pakete</h4>
                                    <div class="info-row"><span class="info-label">Časový záznam:</span> <span class="info-value">${data.timestamp}</span></div>
                                    ${data.duration_s > 0 ? `<div class="info-row"><span class="info-label">Dĺžka:</span> <span class="info-value">${data.duration_s} s</span></div>` : ''}
                                    <div class="info-row"><span class="info-label">Event:</span> <span class="info-value">${data.event}</span></div>
                                    ${data.source ? `<div class="info-row"><span class="info-label">Zdroj:</span> <span class="info-value">${data.source}</span></div>` : ''}
                                    ${data.destination ? `<div class="info-row"><span class="info-label">Cieľ:</span> <span class="info-value">${data.destination}</span></div>` : ''}
                                    ${data.channel_number ? `<div class="info-row"><span class="info-label">Číslo kanálu:</span> <span class="info-value">${data.channel_number}</span></div>` : ''}
                                    <div class="info-row"><span class="info-label">Frekvencia:</span> <span class="info-value">${data.frequency} MHz</span></div>
                                    ${data.timeslot ? `<div class="info-row"><span class="info-label">Timeslot:</span> <span class="info-value">${data.timeslot}</span></div>` : ''}
                                    ${data.color_code ? `<div class="info-row"><span class="info-label">Color code:</span> <span class="info-value">${data.color_code}</span></div>` : ''}
                                </div>
                                
                                <div class="packet-raw-data">
                                    <h4 class="section-title">Nespracované dáta</h4>
                                    <div class="raw-data" id="detailsData">${details}</div>
                                </div>
                                ${isUnknownData ? `
                                <div class="decode-options">
                                    <h4 class="section-title">Nastavenia dekódovania</h4>
                                    
                                    <div class="option-row">
                                        <label for="decodeType">Typ dekódovania:</label>
                                        <select id="decodeType" class="decode-select">
                                            <option value="ascii" ${recommendedSettings.decodeType === 'ascii' ? 'selected' : ''}>ASCII</option>
                                            <option value="utf-8" ${recommendedSettings.decodeType === 'utf-8' ? 'selected' : ''}>UTF-8</option>
                                            <option value="utf-16" ${recommendedSettings.decodeType === 'utf-16' ? 'selected' : ''}>UTF-16</option>
                                        </select>
                                    </div>
                                    
                                    <div class="option-row">
                                        <label for="startPos">Začiatok (index):</label>
                                        <input type="number" id="startPos" class="decode-input" value="${recommendedSettings.startPos}">
                                    </div>
                                    
                                    <div class="option-row">
                                        <label for="endPos">Koniec (index):</label>
                                        <input type="text" id="endPos" class="decode-input" value="${recommendedSettings.endPos}">
                                    </div>
                                </div>` : ''}
                            </div>
                        `;

                        const swalConfig = {
                            title: isUnknownData ? 'Dekódovanie neznámeho paketu' : 'Dekódovanie dátového paketu',
                            html: sweetAlertContent,
                            showCancelButton: true,
                            confirmButtonText: 'Dekódovať',
                            cancelButtonText: 'Zatvoriť',
                            customClass: {
                                container: 'decode-swal-container',
                                popup: 'decode-swal-popup',
                                content: 'decode-swal-content'
                            },
                            preConfirm: async () => {
                                try {
                                    let rawData = document.getElementById("detailsData").innerText;
                                    rawData = rawData.split(":").slice(1).join(":");

                                    let payload = {details: rawData};

                                    if (isUnknownData) {
                                        payload.decodeType = document.getElementById("decodeType").value;
                                        payload.startPos = parseInt(document.getElementById("startPos").value);
                                        
                                        // Handle negative end position correctly
                                        const endPosValue = document.getElementById("endPos").value;
                                        if (endPosValue.startsWith('-')) {
                                            // Keep as string for API to handle
                                            payload.endPos = endPosValue;
                                        } else {
                                            payload.endPos = parseInt(endPosValue);
                                        }
                                    }

                                    const endpoint = isShortData
                                        ? '/api/decode-short-data-packet/'
                                        : '/api/decode-unknown-packet/';

                                    const decodeResponse = await fetch(endpoint, {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json'
                                        },
                                        body: JSON.stringify(payload)
                                    });

                                    if (!decodeResponse.ok) {
                                        const errorData = await decodeResponse.json();
                                        throw new Error(errorData.error || `Chyba: ${decodeResponse.status}`);
                                    }

                                    const result = await decodeResponse.json();
                                    
                                    if (result.decoded_details) {
                                        return {
                                            text: result.decoded_details,
                                            containsGPRMC: result.decoded_details.includes('$GPRMC')
                                        };
                                    } else {
                                        throw new Error('Nepodarilo sa dekódovať dáta.');
                                    }
                                } catch (error) {
                                    Swal.showValidationMessage(`Chyba dekódovania: ${error.message}`);
                                    return false;
                                }
                            }
                        };

                        const result = await Swal.fire(swalConfig);
                        
                        if (result.isConfirmed && result.value) {
                            const decodedText = result.value.text;
                            const containsGPRMC = result.value.containsGPRMC;
                            
                            // Basic HTML for the result display
                            let resultHtml = `
                                <div class="decoded-result">
                                    <h4>Výsledok dekódovania:</h4>
                                    <div class="decoded-content">${decodedText}</div>
                                </div>
                            `;
                            
                            // Extended confirmation if GPS data is detected
                            if (containsGPRMC) {
                                await Swal.fire({
                                    title: 'GPS dáta detekované!',
                                    html: `
                                        ${resultHtml}
                                        <div class="gps-detected">
                                            <p>V dekódovaných dátach sa našli GPS súradnice (GPRMC formát).</p>
                                        </div>
                                    `,
                                    icon: 'success',
                                    showCancelButton: true,
                                    confirmButtonText: 'Pridať na mapu',
                                    cancelButtonText: 'Zatvoriť',
                                    customClass: {
                                        confirmButton: 'gps-add-btn'
                                    }
                                }).then(async (gpsResult) => {
                                    if (gpsResult.isConfirmed) {
                                        try {
                                            const cleanedGprmcData = decodedText.replace(/\\u0000/g, '').replace(/[^\x20-\x7E\n]/g, '');
                                            
                                            let gprmcMatch = /(\$GPRMC,[^*]+\*[A-F0-9]{2})/.exec(cleanedGprmcData);
                                            const gprmcToSend = gprmcMatch ? gprmcMatch[1] : cleanedGprmcData;
                                            
                                            console.log("Sending GPRMC data:", gprmcToSend);
                                            
                                            const gpsResponse = await fetch(`/api/create-gps-entry/${eventId}/`, {
                                                method: 'POST',
                                                headers: {
                                                    'Content-Type': 'application/json'
                                                },
                                                body: JSON.stringify({
                                                    gprmc_data: gprmcToSend
                                                })
                                            });
                                            
                                            if (!gpsResponse.ok) {
                                                const errorData = await gpsResponse.json();
                                                throw new Error(errorData.error || `Chyba: ${gpsResponse.status}`);
                                            }
                                            
                                            const gpsResult = await gpsResponse.json();
                                            
                                            Swal.fire({
                                                title: 'Úspech',
                                                text: 'GPS súradnice boli úspešne pridané do mapy!',
                                                icon: 'success',
                                                confirmButtonText: 'Zobraziť na mape',
                                                showCancelButton: true,
                                                cancelButtonText: 'Zatvoriť'
                                            }).then((result) => {
                                                if (result.isConfirmed) {
                                                    window.location.href = '/mapa/';
                                                }
                                            });
                                        } catch (error) {
                                            Swal.fire({
                                                title: 'Chyba',
                                                text: `Nepodarilo sa pridať GPS súradnice: ${error.message}`,
                                                icon: 'error',
                                                confirmButtonText: 'Zatvoriť'
                                            });
                                        }
                                    }
                                });
                            } else {
                                // Standard success confirmation or error message
                                // Check if the decoded text contains error message
                                if (decodedText.startsWith("Chyba pri dekódovaní")) {
                                    await Swal.fire({
                                        title: 'Chyba dekódovania',
                                        html: `
                                            <div class="decoded-result error">
                                                <h4>Nastala chyba pri dekódovaní:</h4>
                                                <div class="decoded-content error-content">${decodedText}</div>
                                            </div>
                                        `,
                                        icon: 'error',
                                        confirmButtonText: 'Zatvoriť'
                                    });
                                } else {
                                    await Swal.fire({
                                        title: 'Úspešne dekódované',
                                        html: resultHtml,
                                        icon: 'success',
                                        confirmButtonText: 'Zatvoriť'
                                    });
                                }
                            }
                        }
                    } else {
                        // klasické zobrazenie detailov
                        Swal.fire({
                            title: 'Detaily udalosti',
                            html: `
                                <div class="event-details">
                                    <div class="info-row"><span class="info-label">Časový záznam:</span> <span class="info-value">${data.timestamp}</span></div>
                                    ${data.duration_s > 0 ? `<div class="info-row"><span class="info-label">Dĺžka:</span> <span class="info-value">${data.duration_s} s</span></div>` : ''}
                                    <div class="info-row"><span class="info-label">Event:</span> <span class="info-value">${data.event}</span></div>
                                    ${data.source ? `<div class="info-row"><span class="info-label">Zdroj:</span> <span class="info-value">${data.source}</span></div>` : ''}
                                    ${data.destination ? `<div class="info-row"><span class="info-label">Cieľ:</span> <span class="info-value">${data.destination}</span></div>` : ''}
                                    <div class="info-row"><span class="info-label">Frekvencia:</span> <span class="info-value">${data.frequency} MHz</span></div>
                                    ${details ? `<div class="info-row"><span class="info-label">Detaily:</span> <span class="info-value">${details}</span></div>` : ''}
                                </div>
                            `,
                            icon: 'info',
                            confirmButtonText: 'Zatvoriť'
                        });
                    }
                } catch (error) {
                    Swal.fire({
                        title: 'Chyba!',
                        text: 'Nepodarilo sa načítať detaily: ' + error.message,
                        icon: 'error',
                        confirmButtonText: 'Zatvoriť'
                    });
                }
            });

            $('#myTable tbody').on('click', '.delete-btn', function () {
                let eventId = $(this).data('id');

                Swal.fire({
                    title: 'Naozaj zmazať?',
                    text: 'Naozaj chcete zmazať túto udalosť? Táto akcia je nevratná.',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#28a745',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Áno',
                    cancelButtonText: 'Zrušiť'
                }).then((result) => {
                    if (result.isConfirmed) {
                        deleteDmrData(eventId, table);
                    }
                });
            });

            fetch('/api/available-events/')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Chyba: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    const eventList = data.events.map(eventObj => eventObj.event);
                    $('#filterEvent').autocomplete({
                        source: eventList,
                        minLength: 0
                    });
                })
                .catch(error => {
                    Swal.fire({
                        title: 'Chyba!',
                        text: error,
                        icon: 'error',
                        confirmButtonText: 'Zatvoriť'
                    });
                });
                
            fetch('/api/available-detail-types/')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Chyba: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    $('#filterDetails').autocomplete({
                        source: data.detail_types,
                        minLength: 0
                    });
                })
                .catch(error => {
                    Swal.fire({
                        title: 'Chyba!',
                        text: error,
                        icon: 'error',
                        confirmButtonText: 'Zatvoriť'
                    });
                });

            $('#filterDetails').on('keyup change', function () {
                table.draw();
            });

            $('#toggleAdvancedFilters').on('click', function() {
                const container = $('#advancedFiltersContainer');
                const icon = $(this).find('.toggle-icon');
                
                if (container.is(':visible')) {
                    container.slideUp(300);
                    icon.removeClass('open');
                } else {
                    container.slideDown(300);
                    icon.addClass('open');
                }
            });

        });

        function clearDate(id) {
            document.getElementById(id).value = "";
            table.draw();
        }

        function applyDetailPreset() {
            const presetValue = document.getElementById('detailsPresets').value;
            document.getElementById('filterDetails').value = presetValue;
            table.draw();
        }

    </script>

    <style>
        #main {
            padding: 20px;
        }

        #filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: start;
            gap: 15px;
            padding-bottom: 20px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 8px;
